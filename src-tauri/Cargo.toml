[package]
name = "samira"
version = "0.6.1"
description = "Steam achievement manager for Linux"
authors = ["you"]
edition = "2021"
# Derivative work of jsnli/Samira, which is GPL-3.0. Upstream ships the bare
# GPLv3 text with no "or any later version" notice, so no "-or-later" is claimed.
license = "GPL-3.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12.7", features = ["blocking", "json"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
tauri-plugin-shell = "2"
steamworks = "0.12.0"
fuzzy-matcher = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.56"
windows-sys = { version = "0.60", features = ["Win32_System_LibraryLoader", "Win32_Foundation"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = "fat"
codegen-units = 1
# panic = "abort" disables catch_unwind which we rely on to recover from
# steamworks panics (games without achievements panic in get_num_achievements).
panic = "unwind"
strip = true
opt-level = 3
