# Keep the supply chain current: GitHub Actions, Cargo and npm dependencies.
#
# From Project-Colony-Resources templates/dependabot.yml, with two changes for
# this repository: the Rust crate lives in src-tauri/, and the Svelte frontend
# adds an npm ecosystem at the root.
#
# Dependabot opening a PR is not the rule being followed, merging it is. See
# design/dependencies.md: everything is on its latest release, always.
version: 2
updates:
  # A stale action is the same problem as a stale crate, with more privileges.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Transitive crates too, so the lockfile stays current without a manual
    # `cargo update`.
    allow:
      - dependency-type: all
    groups:
      # Minor and patch bumps arrive as one PR, so a routine week is one review
      # rather than fifteen. Majors stay separate: they deserve their own read.
      cargo-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Transitive packages too: most npm alerts this repository has had came
    # from one (postcss, devalue, source-map-js).
    allow:
      - dependency-type: all
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
