# Keep the supply chain current: GitHub Actions, Cargo and npm dependencies.
#
# From Project-Colony-Resources templates/dependabot.yml, with two changes for
# this repository: the Rust crate lives in src-tauri/, and the Svelte frontend
# adds an npm ecosystem at the root.
#
# Dependabot opening a PR is not the rule being followed, merging it is. See
# design/dependencies.md: everything is on its latest release, always.
version: 2
updates:
  # A stale action is the same problem as a stale crate, with more privileges.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The shared signing workflow stays at the organisation pin, which moves
    # for every program at once: design/releases.md in
    # Project-Colony-Resources, "The pin". A Dependabot PR would move one
    # repository alone. Dependabot names that dependency after the workflow
    # path (Project-Colony/Project-Colony-Resources/.github/workflows/...), so
    # the rule needs the trailing wildcard to match it.
    ignore:
      - dependency-name: "Project-Colony/Project-Colony-Resources*"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Transitive crates too, so the lockfile stays current without a manual
    # `cargo update`.
    allow:
      - dependency-type: all
    groups:
      # Minor and patch bumps arrive as one PR, so a routine week is one review
      # rather than fifteen. Majors stay separate: they deserve their own read.
      cargo-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Transitive packages too: most npm alerts this repository has had came
    # from one (postcss, devalue, source-map-js).
    allow:
      - dependency-type: all
    ignore:
      # svelte-check does not support TypeScript 7 yet: its peer range stops
      # at 6, so npm ci fails on 7, and 4.7 only runs 7 through an
      # experimental --tsgo mode that needs TypeScript 6 installed alongside.
      # Remove this once a svelte-check release supports TypeScript 7 directly.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # vite pins rolldown to one minor (~1.2 for vite 8.3), so a newer
      # rolldown minor cannot land on its own and the update job fails with
      # NoChangeError (run of 2026-11-13). rolldown moves with vite instead.
      - dependency-name: rolldown
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
