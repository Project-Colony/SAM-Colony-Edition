# Copy to .github/dependabot.yml.
# Rules: design/dependencies.md "Automatic merges". Add only
# repository-specific ignores, directories or a cargo-dev group.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "07:00"
      timezone: Europe/Brussels
    # GitHub Actions supports default-days only.
    cooldown:
      default-days: 7
    # chore is a hidden changelog section, so action updates never release.
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # Dependabot names the shared workflows after their path, hence the wildcard.
      # The pin moves by hand (design/releases.md "The pin").
      - dependency-name: "Project-Colony/Project-Colony-Resources*"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: friday
      time: "07:00"
      timezone: Europe/Brussels
    cooldown:
      default-days: 7
    # fix lands under Fixes and cuts a patch release.
    commit-message:
      prefix: fix
      include: scope
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    groups:
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Repository-specific: crates listed only under [dev-dependencies].
      # weekly-merge.yml squashes this group as chore(deps), so it never
      # releases. List the same names in cargo-minor's exclude-patterns.
      # cargo-dev:
      #   patterns: ["criterion", "tempfile"]
      #   update-types: ["minor", "patch"]
      cargo-minor:
        update-types: ["minor", "patch"]
        # exclude-patterns: ["criterion", "tempfile"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "07:00"
      timezone: Europe/Brussels
    cooldown:
      default-days: 7
    # svelte and vite are devDependencies but ship in the frontend bundle,
    # so every npm update is a fix.
    commit-message:
      prefix: fix
      include: scope
    open-pull-requests-limit: 5
    allow:
      - dependency-type: all
    ignore:
      # svelte-check does not support TypeScript 7 yet: its peer range stops
      # at 6, so npm ci fails on 7, and 4.7 only runs 7 through an
      # experimental --tsgo mode that needs TypeScript 6 installed alongside.
      # Remove this once a svelte-check release supports TypeScript 7 directly.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # vite pins rolldown to one minor (~1.2 for vite 8.3), so a newer
      # rolldown minor cannot land on its own and the update job fails with
      # NoChangeError (run of 2026-11-13). rolldown moves with vite instead.
      - dependency-name: rolldown
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-minor:
        update-types: ["minor", "patch"]
