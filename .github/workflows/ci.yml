name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-14
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Linux deps
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev

      # Pinned to master with `toolchain: stable` rather than to the `stable`
      # branch: that branch is rebased onto every master commit, so a SHA
      # pinned on it stops being reachable from any branch.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}-ci

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      # svelte-check, then vite build: the release runs the same script, so the
      # platform's native rolldown and lightningcss bindings are exercised here
      # before a release depends on them.
      - run: npm run build
      # OS-independent frontend checks, so one leg is enough: en/fr parity,
      # palette colours and scaled sizes only, the palette logic, and the
      # vendored Colony themes, labels and fonts against Resources.
      - name: Frontend checks
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          npm run check:i18n
          npm run check:style
          npm test
          npm run check:vendored
      # Clippy type-checks every target, tests included, so it stands in for
      # cargo check. Each OS compiles its own cfg branches (registry lookup,
      # console handling, library loading), so every leg lints and tests.
      - name: Clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --target ${{ matrix.target }} -- -D warnings
      # Linux and macOS load the Steamworks library in their own way
      # (src-tauri/src/bootstrap.rs), which a unit test calls through. The rest
      # is OS-independent logic, run on Windows too.
      - name: Unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # v0.7.0 shipped Linux and macOS executables that did not start unless
      # Valve's libsteam_api was installed system-wide. Run the executable from
      # a directory of its own, with no library path, as a user would. On
      # macOS, also check that no symbol is bound to the weakly linked library:
      # it would be null at runtime instead of failing here.
      - name: Start without libsteam_api installed
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cargo build --locked --manifest-path src-tauri/Cargo.toml
          d=$(mktemp -d)
          cp src-tauri/target/debug/samira "$d/"
          if [ "$RUNNER_OS" = macOS ] && nm -m -u "$d/samira" | grep -F libsteam_api; then
            echo "::error::these symbols are bound to libsteam_api instead of SAM's own stubs"
            exit 1
          fi
          env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH -u DYLD_FALLBACK_LIBRARY_PATH "$d/samira" --version

  # rust-version in src-tauri/Cargo.toml is a promise about who can build SAM.
  # The check job only ever runs on stable, so this leg is what keeps it true.
  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the declared MSRV
        id: msrv
        run: |
          version=$(grep '^rust-version' src-tauri/Cargo.toml | tr -d ' "' | cut -d= -f2)
          [ -n "$version" ] || { echo "::error::could not read rust-version from src-tauri/Cargo.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libsoup-3.0-dev

      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-10-09
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
          key: msrv-${{ steps.msrv.outputs.version }}

      - name: Build on the declared floor
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
